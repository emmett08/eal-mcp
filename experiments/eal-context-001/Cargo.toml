[package]
name = "eal-context-experiment"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"
description = "Isolated native machinery and planning diagnostics for EAL-CONTEXT-001"

[[bin]]
name = "eal-context"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["arbitrary_precision", "preserve_order", "raw_value"] }
sha2 = "=0.10.9"
chrono = { version = "=0.4.42", default-features = false, features = ["std", "clock"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
rustix = { version = "=1.1.2", features = ["process"] }
num-bigint = "=0.4.6"
uuid = { version = "=1.28.0", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"
