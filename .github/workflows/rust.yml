name: Rust language and runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: rust (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test without a reference interpreter
        run: cargo test --workspace --locked
      - name: Build standalone commands and native companions
        run: cargo build --release --workspace --locked

  regeneration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check generated recognisers
        run: sh tools/regenerate-parser.sh --check
