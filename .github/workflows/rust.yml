name: Rust language and runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: rust (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      # Keep file/line backtraces without full type/variable debug information.
      # Assertions and overflow checks retain their normal dev/test settings.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Identify compatible build environment
        id: build-environment
        env:
          EAL_BUILD_CONFIGURATION: ${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml', '**/build.rs', '.cargo/config*', '.github/workflows/rust.yml') }}
        shell: bash
        run: |
          fingerprint=$(
            {
              rustc -vV
              cc --version
              printf '%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            } | sha256sum | cut -d ' ' -f 1
          )
          printf 'prefix=%s-%s-cargo-v1-%s-%s\n' \
            "$RUNNER_OS" "$RUNNER_ARCH" "$fingerprint" \
            "$EAL_BUILD_CONFIGURATION" >> "$GITHUB_OUTPUT"
      - name: Restore Cargo downloads and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, Node.js 24
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            target
          key: ${{ steps.build-environment.outputs.prefix }}-${{ github.sha }}
          restore-keys: ${{ steps.build-environment.outputs.prefix }}-
      # Cache hits never replace verification: Cargo rechecks changed inputs.
      - name: Check lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build native companions required by integration tests
        run: cargo build --workspace --bins --locked
      - name: Test the Rust workspace
        run: cargo test --workspace --locked
      - name: Build standalone commands, native companions and coordination worker
        run: cargo build --release --workspace --locked --lib --bins --example coordination_software_worker
      - name: Check installed application boundaries
        run: target/release/eal-smoke applications --prefix "$PWD/target/release"
      - name: Check installed coordination and recovery
        run: target/release/eal-smoke coordination --prefix "$PWD/target/release" --worker "$PWD/target/release/examples/coordination_software_worker"
      - name: Check out the pinned ASPIC consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emmett08/aspic_visualisation
          ref: 6c8c5c2e052f3d27c0382f6de37eee1e96d0a69d
          path: consumer-checkout
          persist-credentials: false
      - name: Install Node for the complete consumer import check
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install the pinned consumer dependencies
        working-directory: consumer-checkout
        run: npm ci
      - name: Check native exports through the complete consumer importer
        run: |
          target/release/eal-smoke consumer \
            --consumer "$PWD/consumer-checkout/src/domain/aspic.ts" \
            --binary "$PWD/target/release/eal-core" \
            --node "$(command -v node)"

  context-experiment:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Identify compatible experiment environment
        id: experiment-environment
        shell: bash
        run: |
          fingerprint=$(
            { rustc -vV; cc --version; printf '%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"; } \
              | sha256sum | cut -d ' ' -f 1
          )
          printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore experiment downloads and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, Node.js 24
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            experiments/eal-context-001/target
          key: ${{ runner.os }}-${{ runner.arch }}-context-v1-${{ steps.experiment-environment.outputs.fingerprint }}-${{ hashFiles('rust-toolchain.toml', 'experiments/eal-context-001/Cargo.lock', 'experiments/eal-context-001/Cargo.toml', '.cargo/config*', '.github/workflows/rust.yml') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-context-v1-${{ steps.experiment-environment.outputs.fingerprint }}-${{ hashFiles('rust-toolchain.toml', 'experiments/eal-context-001/Cargo.lock', 'experiments/eal-context-001/Cargo.toml', '.cargo/config*', '.github/workflows/rust.yml') }}-
      - name: Check experiment formatting
        run: cargo fmt --manifest-path experiments/eal-context-001/Cargo.toml --check
      - name: Check experiment lints
        run: cargo clippy --manifest-path experiments/eal-context-001/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test experiment machinery
        run: cargo test --manifest-path experiments/eal-context-001/Cargo.toml --locked

  regeneration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check generated recognisers
        run: sh tools/regenerate-parser.sh --check
