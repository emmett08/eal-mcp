name: Rust front end

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test without a reference interpreter
        run: cargo test --workspace --locked
      - name: Build the standalone syntax command
        run: cargo build --release --locked -p eal-cli

  regeneration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check generated recognisers
        run: sh tools/regenerate-parser.sh --check
