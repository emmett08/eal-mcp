[workspace]
members = ["crates/eal-parser", "crates/eal-core", "crates/eal-aspic", "crates/eal-runtime", "crates/eal-mcp", "crates/eal-coordination", "crates/eal-coordination-contracts", "crates/eal-cli", "tools/eal-devtools", "crates/eal-collectors", "crates/eal-collector-contracts", "crates/eal-process", "crates/eal-adapters", "crates/eal-evidence"]
resolver = "2"
exclude = ["vendor/rmcp", "experiments/eal-context-001"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"
repository = "https://github.com/emmett08/eal-mcp"

[workspace.dependencies]
antlr4rust = "=0.6.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["arbitrary_precision", "preserve_order", "raw_value"] }
sha2 = "=0.10.9"
num-bigint = { version = "=0.4.6", features = ["serde"] }
num-rational = { version = "=0.4.2", features = ["serde"] }
num-traits = "=0.2.19"
num-integer = "=0.1.46"
chrono = { version = "=0.4.42", default-features = false, features = ["std", "serde"] }
ryu = "=1.0.23"
indexmap = { version = "=2.12.0", features = ["serde"] }
unicode-general-category = "=0.6.0"
toml = "=0.9.8"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
rustix = { version = "=1.1.2", features = ["process", "fs", "pipe", "event", "time", "thread"] }
hmac = "=0.12.1"
uuid = { version = "=1.28.0", features = ["v4"] }
signal-hook = "=0.3.18"
getrandom = "=0.4.3"
rmcp = { version = "=3.6.0", default-features = false, features = ["server", "client", "transport-io", "transport-child-process", "transport-streamable-http-client-reqwest", "transport-streamable-http-server", "reqwest"] }
tokio = { version = "=1.54.0", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "io-util", "net", "process", "signal"] }
tokio-util = "=0.7.20"
axum = "=0.8.9"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
url = "=2.5.8"
http = "=1.5.0"
tower = { version = "=0.5.3", features = ["util"] }
jsonschema = { version = "=0.46.0", default-features = false, features = ["arbitrary-precision"] }
nom = "=8.0.0"
base64 = "=0.23.1"
eal-collector-contracts = { path = "crates/eal-collector-contracts" }
eal-parser = { path = "crates/eal-parser" }
eal-core = { path = "crates/eal-core" }
eal-aspic = { path = "crates/eal-aspic" }
eal-runtime = { path = "crates/eal-runtime" }
eal-mcp = { path = "crates/eal-mcp" }
eal-coordination = { path = "crates/eal-coordination" }
eal-coordination-contracts = { path = "crates/eal-coordination-contracts" }

eal-process = { path = "crates/eal-process" }
eal-adapters = { path = "crates/eal-adapters" }
eal-evidence = { path = "crates/eal-evidence" }

[workspace.lints.rust]
unsafe_code = "forbid"

# Fresh runtime checks hash complete native companions, including debug symbols.
# Test builds inherit this override and keep the existing gateway deadlines.
[profile.dev.package.sha2]
opt-level = 3

[patch.crates-io]
rmcp = { path = "vendor/rmcp" }
