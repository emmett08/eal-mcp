[package]
name = "eal-model-host"
description = "Pinned local Qwen2 LoRA tool-use host for EAL/4 MCP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "eal-model-host"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
rmcp.workspace = true
jsonschema.workspace = true
eal-mcp-client.workspace = true
eal-collector-contracts.workspace = true
candle-core = "=0.9.1"
candle-nn = "=0.9.1"
candle-transformers = "=0.9.1"
tokenizers = { version = "=0.21.4", default-features = false, features = ["onig"] }
minijinja = { version = "=2.24.0", features = ["builtins", "json"] }

[dev-dependencies]
tempfile = "=3.23.0"

[features]
default = []
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate"]

[lints]
workspace = true
