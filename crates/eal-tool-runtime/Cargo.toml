[package]
name = "eal-tool-runtime"
description = "Portable pinned tool packages with bounded isolated execution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "eal-tool-run"
path = "src/main.rs"

[dependencies]
eal-process.workspace = true
eal-collector-contracts.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["arbitrary_precision", "raw_value"] }
sha2 = "0.10.9"
rustix = { version = "1.1.2", features = ["fs"] }
toml = "0.9.8"
jsonschema = { version = "0.46.0", default-features = false, features = ["arbitrary-precision"] }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "signal"] }
tar = { version = "=0.4.46", default-features = false }

[dev-dependencies]
tempfile = "=3.23.0"

[lints]
workspace = true
