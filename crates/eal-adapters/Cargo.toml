[package]
name = "eal-adapters"
description = "Optional bounded acquisition and specialised trace adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
eal-process.workspace = true
eal-collector-contracts.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["arbitrary_precision", "raw_value"] }
sha2 = "0.10.9"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process", "signal"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
rustix = { version = "1.1.2", features = ["process", "fs", "pipe", "event", "time", "thread"] }

[lints]
workspace = true
